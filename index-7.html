<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>ZADNEPROVSKII — Universe</title>
<style>
:root{--ink:#111116;--muted:#777780;--line:#e8e8ed;--violet:#7855c8;--paper:#fff;--night:#080713;--left:246px;--right:268px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}button,select{font:inherit}
.app{display:grid;grid-template-columns:var(--left) minmax(0,1fr) var(--right);min-height:100vh}
.left,.right{height:100vh;position:sticky;top:0;overflow:auto;background:#fff;z-index:4}
.left{border-right:1px solid var(--line);padding:26px 19px 18px;display:flex;flex-direction:column}
.right{border-left:1px solid var(--line);padding:27px 22px}
.brand{display:flex;align-items:center;gap:12px;padding:0 7px 43px}
.brand-symbol{width:39px;height:39px;border-radius:13px;background:radial-gradient(circle at 34% 25%,#d7c9ff,#7852c8 58%,#20113e);box-shadow:0 5px 18px #7052b52b}
.brand-name{font-size:12px;font-weight:850;letter-spacing:.16em}.brand-sub{font-size:9px;color:#898991;letter-spacing:.06em;margin-top:4px}
.nav-title{font-size:9px;color:#a0a0a6;letter-spacing:.2em;font-weight:750;padding:0 10px 12px}
.nav{display:grid;gap:5px}.nav a{display:flex;align-items:center;gap:12px;padding:12px 11px;border-radius:11px;font-size:13px;color:#55545d;font-weight:570}
.nav a:hover{background:#f7f6fa}.nav a.active{background:#f0edf6;color:#18131f}
.nav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-divider{height:1px;background:var(--line);margin:16px 5px}
.account{margin-top:auto;border-top:1px solid var(--line);padding:17px 5px 0;display:flex;align-items:center;gap:10px}
.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;background:radial-gradient(circle at 35% 25%,#d7caff,#7554c5 68%)}
.account b{font-size:12px}.account small{display:block;color:#888;font-size:10px;margin-top:3px}
.center{min-width:0;overflow:hidden}
.topbar{height:73px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,3.2vw,46px);border-bottom:1px solid #f0f0f2;background:#fff}
.crumb{font-size:12px;color:#898991}.crumb b{color:#222;margin-left:5px}
.top-actions{display:flex;align-items:center;gap:9px}.round{height:36px;width:36px;border:1px solid #e8e8ec;background:#fff;border-radius:50%;color:#333;display:grid;place-items:center}.lang{height:36px;border:1px solid #e8e8ec;border-radius:22px;padding:0 12px;background:#fff;color:#333;font-size:12px}
.content{padding:0 clamp(22px,3.2vw,46px)}
.white-hero{padding-top:42px;padding-bottom:30px;background:#fff}
.hero-top{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:center;min-height:250px}
.kicker{font-size:10px;letter-spacing:.25em;font-weight:800;color:#777;margin-bottom:15px}
h1{font-size:clamp(40px,4.3vw,59px);line-height:.99;letter-spacing:-.065em;margin:0 0 15px;font-weight:770}
.hero-copy p{font-size:15px;line-height:1.6;color:#73737b;margin:0 0 22px;max-width:570px}
.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border-radius:28px;padding:12px 19px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;justify-content:center}
.btn-dark{background:#111;color:#fff;border:1px solid #111}.btn-light{background:#fff;color:#fff;border:1px solid #ffffff9c}
.mountain-art{height:260px;position:relative;overflow:hidden;isolation:isolate}
.mountain-art:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 68% 70%,#fff 0,rgba(255,255,255,.7) 22%,transparent 56%),linear-gradient(180deg,#fff 0%,#f4f6f8 50%,#fff 100%);z-index:-2}
.mountain-art svg{width:100%;height:100%;display:block}
.stats{display:flex;gap:10px;margin:21px 0 24px;flex-wrap:wrap}.stat{border:1px solid #e9e9ed;border-radius:12px;padding:11px 15px;min-width:105px}.stat small{display:block;color:#888;font-size:10px;margin-bottom:6px}.stat b{font-size:21px;font-weight:650}
.modules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:5px}
.module{border:1px solid #e8e8ed;border-radius:14px;padding:15px 15px 14px;min-height:116px;background:#fff;transition:border-color .15s,transform .15s}
.module:hover{border-color:#c9bce7;transform:translateY(-2px)}
.module-icon{width:23px;height:23px;margin-bottom:11px;color:#26232d}.module-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.module b{display:block;font-size:12px;margin-bottom:5px}.module small{font-size:10px;color:#85858d}
.galaxy-section{position:relative;overflow:hidden;isolation:isolate;min-height:400px;padding:55px clamp(22px,3.2vw,46px);color:#fff;background:radial-gradient(ellipse at 65% 40%,rgba(100,59,174,.68),transparent 42%),radial-gradient(ellipse at 25% 25%,rgba(54,34,117,.65),transparent 42%),radial-gradient(ellipse at 82% 85%,rgba(75,44,143,.45),transparent 36%),linear-gradient(130deg,#070611,#110b27 52%,#070713)}
.galaxy-section:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;background-image:radial-gradient(1px 1px at 8% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 22% 72%,#d9ceff 98%,transparent),radial-gradient(1.5px 1.5px at 67% 21%,#fff 98%,transparent),radial-gradient(1px 1px at 88% 43%,#fff 98%,transparent),radial-gradient(1px 1px at 46% 88%,#cfc4ff 98%,transparent),radial-gradient(1px 1px at 74% 75%,#fff 98%,transparent);background-size:310px 260px,390px 310px,270px 300px,360px 330px,290px 340px,400px 280px}
.galaxy-inner{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:center;position:relative;z-index:1}
.galaxy-section .kicker{color:#c9b8ff}.galaxy-section h2{font-size:clamp(34px,4vw,50px);letter-spacing:-.06em;line-height:1.02;margin:0 0 14px}.galaxy-section p{font-size:14px;line-height:1.7;color:rgba(255,255,255,.72);max-width:390px;margin:0 0 22px}
.map{height:285px;width:100%}.map svg{height:100%;width:100%}.map line{stroke:#c8b5ff;stroke-width:1.15;opacity:.58}.map .halo{fill:#a783ff;opacity:.17}.map .star{fill:#f8f4ff}
.white-lower{padding-top:62px;padding-bottom:72px;background:#fff}
.lower-head{max-width:650px;margin-bottom:28px}.lower-head h2{font-size:clamp(30px,3.6vw,44px);letter-spacing:-.055em;line-height:1.05;margin:0 0 12px}.lower-head p{font-size:14px;color:#777780;line-height:1.65;margin:0}
.lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.photo-card{height:210px;border-radius:15px;overflow:hidden;position:relative;background:linear-gradient(150deg,#e8edf2,#f9fafb 48%,#d4dbe2)}
.photo-card.mountain-two:before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 36%,#fff9 37%,transparent 39%),linear-gradient(135deg,transparent 43%,#aeb8c4 44%,#f9fbfc 58%,#c0c9d2 59%,transparent 75%);clip-path:polygon(0 100%,0 64%,23% 25%,38% 52%,57% 8%,80% 61%,100% 36%,100% 100%)}
.photo-card.abstract:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 35%,#c8b9ee,transparent 22%),radial-gradient(circle at 73% 66%,#d4deed,transparent 27%),linear-gradient(120deg,#f4f2f9,#e9edf4)}
.lower-caption{padding-top:13px}.lower-caption b{font-size:13px}.lower-caption small{display:block;color:#85858d;font-size:11px;margin-top:5px}
.right-status{display:flex;align-items:center;gap:9px;font-size:11px;color:#555;margin-bottom:36px}.green{width:7px;height:7px;background:#31c48d;border-radius:50%}
.right-block{border-bottom:1px solid var(--line);padding-bottom:21px;margin-bottom:21px}.right-block h3{font-size:11px;margin:0 0 12px}.right-block p{font-size:11px;line-height:1.65;color:#777;margin:0}
.quick{display:grid;gap:3px}.quick a{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:11px;color:#333}.quick-icon{width:30px;height:30px;border:1px solid #e9e9ed;border-radius:9px;display:grid;place-items:center;color:#333;font-size:14px}
.knowledge{height:108px;border-radius:12px;background:radial-gradient(ellipse at 50% 50%,#9669d4,#2c1a4e 58%,#0a0814);position:relative;overflow:hidden;margin:11px 0}
.knowledge:before{content:"";position:absolute;width:150px;height:62px;border:1px solid #d4baff;border-radius:50%;transform:rotate(-23deg);left:20%;top:18%;box-shadow:0 0 25px #9d76d7}
.knowledge:after{content:"✦";position:absolute;color:#fff;left:54%;top:38%;font-size:18px;text-shadow:0 0 12px #fff}
footer{border-top:1px solid var(--line);padding:19px clamp(22px,3.2vw,46px);font-size:10px;color:#888;background:#fff}
@media(max-width:1180px){:root{--left:210px;--right:230px}.modules{grid-template-columns:repeat(2,1fr)}.hero-top{grid-template-columns:1fr .8fr}.mountain-art{height:220px}}
@media(max-width:850px){:root{--left:72px;--right:0px}.left{padding:20px 9px}.brand{justify-content:center;padding:0 0 35px}.brand-copy,.nav-title,.nav a span,.account-copy{display:none}.nav a{justify-content:center;padding:13px 8px}.nav svg{width:20px;height:20px}.account{justify-content:center;padding:15px 0 0}.right{display:none}.app{grid-template-columns:var(--left) minmax(0,1fr)}}
@media(max-width:600px){:root{--left:0px}.left{display:none}.app{display:block}.topbar{height:60px;padding:0 17px}.content{padding-left:19px;padding-right:19px}.white-hero{padding-top:33px}.hero-top{grid-template-columns:1fr;min-height:0}.mountain-art{height:170px;margin-top:8px;opacity:.9}.modules{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.module{padding:12px;min-height:108px}.stats{margin:18px 0}.galaxy-section{padding:42px 19px}.galaxy-inner{grid-template-columns:1fr}.map{height:195px}.white-lower{padding-top:45px;padding-bottom:50px}.lower-grid{grid-template-columns:1fr}.photo-card{height:180px}}

/* ===== v1.0 additions ===== */
.btn-light{background:#ffffff1c;color:#fff;border:1px solid #ffffff55;backdrop-filter:blur(8px)}
.btn-light:hover{background:#ffffff30}
.btn{transition:background .15s,transform .15s}.btn:hover{transform:translateY(-1px)}
:focus-visible{outline:2px solid #7855c8;outline-offset:2px}
.round svg,.quick-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.round{cursor:pointer;position:relative}.round .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#7855c8;border:1.5px solid #fff}
.nav-badge{margin-left:auto;font-size:10px;background:#7855c8;color:#fff;border-radius:10px;padding:2px 7px;font-weight:700}

/* hero mountain */
.white-hero{padding-bottom:36px}
.hero-top{grid-template-columns:1fr 1.15fr;min-height:430px;position:relative}
.mountain-art{height:470px;margin:-30px calc(-1 * clamp(22px,3.2vw,46px)) -30px -90px;background:#fff;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(0deg,transparent 0,#000 18%),linear-gradient(180deg,transparent 0,#000 8%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 30%),linear-gradient(0deg,transparent 0,#000 18%),linear-gradient(180deg,transparent 0,#000 8%);mask-composite:intersect}
.mountain-art:before{display:none}
.mountain-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 40%;display:block}
.hero-copy{position:relative;z-index:2}
.hero-copy h1{text-shadow:0 0 30px #fff,0 0 12px #fff}
.learn{padding-top:72px;padding-bottom:80px;scroll-margin-top:20px}
.learn-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,4vw,64px);align-items:start}
.learn h2{font-size:clamp(32px,3.8vw,48px);letter-spacing:-.055em;line-height:1.03;margin:0}
.learn-text p{font-size:15px;line-height:1.75;color:#555560;margin:0 0 16px;max-width:560px}
.learn-text p:first-child{font-size:17px;color:#222;line-height:1.6}
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:44px;border-top:1px solid var(--line);padding-top:28px}
.principles svg{width:22px;height:22px;stroke:#5a3fb0;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
.principles b{display:block;font-size:14px;margin-bottom:6px}.principles p{margin:0;font-size:12.5px;line-height:1.65;color:#777780}
@media(max-width:900px){.learn-grid,.principles{grid-template-columns:1fr}}
.modules{margin-top:26px}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#555;border:1px solid #e6e6ec;background:#fffc;border-radius:20px;padding:6px 11px}
.chip svg{width:13px;height:13px;stroke:#7855c8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat b{font-variant-numeric:tabular-nums}

/* galaxy */
.galaxy-section{min-height:560px;padding-top:70px;padding-bottom:60px;background:#07050f}
.galaxy-section:before{display:none}
.galaxy-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;object-fit:cover}
.galaxy-inner{grid-template-columns:.62fr 1.38fr;gap:10px}
.galaxy-section h2{text-shadow:0 2px 30px #07050f}
.galaxy-stats{display:flex;gap:18px;margin:0 0 22px;font-size:11px;color:#cdbfff}.galaxy-stats b{display:block;font-size:22px;color:#fff;font-weight:650;margin-bottom:2px}
.map{height:430px;position:relative}
.map svg{overflow:visible}
.map .orbit{fill:none;stroke:#b79cff;stroke-width:.8;opacity:.22}
.map .orbit.dash{stroke-dasharray:2 7;opacity:.3}
.map .tick{stroke:#b79cff;stroke-width:.8;opacity:.3}
.map .faint line{stroke:#9d8bd8;stroke-dasharray:3 5;opacity:.3;stroke-width:.9}
.map .faint circle{fill:#d9d0ff;opacity:.75}
.map .link{stroke:#cdb9ff;stroke-width:1.2;opacity:.6}
.map .node{cursor:pointer}
.map .node .halo{fill:#a783ff;opacity:.2;transition:r .25s,opacity .25s}
.map .node .ring{fill:none;stroke:#e5dcff;stroke-width:1;opacity:0;transition:opacity .25s}
.map .node:hover .halo,.map .node:focus .halo{r:30;opacity:.38}
.map .node:hover .ring,.map .node:focus .ring{opacity:.85}
.map .node .star{fill:#fbf8ff}
.map .node text{fill:#e8e0ff;font-size:12.5px;font-weight:600;letter-spacing:.01em;paint-order:stroke;stroke:#0a0716;stroke-width:4px;stroke-linejoin:round}
.map .node text.sub{fill:#a999d9;font-size:10px;font-weight:500}
.map .spike{stroke:#fff;stroke-width:.8;opacity:.6}
.map .cname{fill:#a999d9;font-size:10px;letter-spacing:.22em}

/* features */
.white-lower{padding-top:70px}
.feat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:64px}
.feat{border:1px solid #e8e8ed;border-radius:14px;padding:18px;background:#fff;transition:border-color .15s,box-shadow .15s}
.feat:hover{border-color:#cdbfee;box-shadow:0 8px 30px #7855c814}
.feat .fi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(145deg,#f3eefc,#e8eef8);color:#5a3fb0}
.feat .fi svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.feat b{display:block;font-size:13px;margin-bottom:6px}.feat p{margin:0;font-size:11.5px;line-height:1.6;color:#80808a}
.live-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.live-head h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.05em;margin:0 0 8px}.live-head p{margin:0;font-size:13px;color:#777780}
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border:1px solid #e8e8ed;border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column;min-height:380px;scroll-margin-top:90px}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid #f0f0f3;font-size:12px;font-weight:650}
.panel-h svg{width:16px;height:16px;stroke:#5a3fb0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel-h small{margin-left:auto;font-weight:500;color:#9a9aa3;font-size:10px}
/* messenger */
.msgr{display:grid;grid-template-columns:128px 1fr;flex:1;min-height:0}
.rooms{border-right:1px solid #f0f0f3;padding:10px 8px;display:flex;flex-direction:column;gap:2px;background:#fbfbfd}
.rooms h4{margin:8px 8px 6px;font-size:9px;letter-spacing:.14em;color:#a3a3ab}
.room{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px;border-radius:9px;font-size:12px;color:#55545d}
.room:hover{background:#f1eff7}.room[aria-selected=true]{background:#ece7f8;color:#1b1328;font-weight:600}
.room .u{margin-left:auto;font-size:9px;background:#7855c8;color:#fff;border-radius:9px;padding:1px 6px}
.room i{font-style:normal;color:#9a8fc0;font-weight:700}
.av{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700}
.chat{display:flex;flex-direction:column;min-width:0}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:260px;min-height:260px}
.m{display:flex;gap:8px;max-width:88%}.m .av{margin-top:2px}
.m div.b{background:#f3f2f7;border-radius:4px 13px 13px 13px;padding:8px 11px;font-size:12px;line-height:1.5}
.m small{display:block;font-size:9px;color:#9a9aa3;margin-bottom:2px}
.m.me{align-self:flex-end;flex-direction:row-reverse}.m.me div.b{background:#111;color:#fff;border-radius:13px 4px 13px 13px}.m.me small{text-align:right}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #f0f0f3}
.composer input{flex:1;min-width:0;border:1px solid #e5e5ea;border-radius:20px;padding:9px 14px;font:inherit;font-size:12px;outline:none}
.composer input:focus{border-color:#a88be6}
.send{width:36px;height:36px;border-radius:50%;border:0;background:#111;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.send svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.send:hover{background:#5a3fb0}
/* threads */
.threads{padding:6px 8px;display:flex;flex-direction:column}
.thread{display:grid;grid-template-columns:42px 1fr;gap:10px;padding:12px 8px;border-bottom:1px solid #f3f3f6}.thread:last-child{border:0}
.vote{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid #e6e6ec;border-radius:10px;padding:6px 0;font-size:11px;font-weight:650;color:#666;height:fit-content}
.vote svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.vote:hover{border-color:#bda9ee}.vote[aria-pressed=true]{background:#7855c8;border-color:#7855c8;color:#fff}
.thread h4{margin:0 0 5px;font-size:13px;letter-spacing:-.01em}.thread p{margin:0 0 8px;font-size:11.5px;color:#80808a;line-height:1.55}
.meta{display:flex;gap:10px;align-items:center;font-size:10px;color:#9a9aa3;flex-wrap:wrap}
.tags .tag{font-size:11px}
.tag{background:#f1edf9;color:#5a3fb0;border-radius:6px;padding:2px 7px;font-weight:600}
.meta svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-1px;margin-right:3px}
/* ai */
.ai-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:260px;max-height:270px;background:radial-gradient(ellipse at 100% 0,#f3edff 0,transparent 50%)}
.bub{max-width:90%;font-size:12px;line-height:1.6;padding:9px 12px;border-radius:13px}
.bub.u{align-self:flex-end;background:#111;color:#fff;border-bottom-right-radius:4px}
.bub.a{background:#fff;border:1px solid #ebe6f6;border-bottom-left-radius:4px}
.bub.a.typing{color:#a99bd0;letter-spacing:.2em}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.chips button{all:unset;cursor:pointer;font-size:11px;border:1px solid #e3dcf3;background:#faf8ff;color:#5a3fb0;border-radius:16px;padding:6px 11px}
.chips button:hover{background:#efe9fb}
/* notes */
.notes{padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.note-card{border:1px solid #ececf1;border-radius:12px;padding:13px 14px;background:linear-gradient(180deg,#fff,#fbfaff)}
.note-card h4 svg{width:16px;height:16px;stroke:#5a3fb0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note-card h4{margin:0 0 9px;font-size:13px;display:flex;align-items:center;gap:8px}
.task{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:12px;padding:5px 0;color:#444;width:100%}
.task .cb{width:15px;height:15px;border-radius:5px;border:1.5px solid #c4bbdc;display:grid;place-items:center;flex:none}
.task .cb svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task[aria-checked=true] .cb{background:#7855c8;border-color:#7855c8}.task[aria-checked=true] .cb svg{opacity:1}
.task[aria-checked=true] span{text-decoration:line-through;color:#a0a0a8}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.progress{height:5px;border-radius:5px;background:#eee9f8;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#9b7cf0,#5a3fb0);width:0;transition:width .3s}
.saved-row{display:flex;align-items:center;gap:10px;font-size:12px;padding:6px 0;color:#444}
.saved-row svg{width:15px;height:15px;stroke:#7855c8;fill:#7855c822;stroke-width:1.8}
.cta{margin:70px 0 0;border-radius:20px;padding:42px clamp(22px,4vw,48px);color:#fff;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 85% 20%,#6b46c1aa,transparent 55%),linear-gradient(135deg,#0c0820,#1b1040)}
.cta h2{margin:0 0 10px;font-size:clamp(26px,3vw,38px);letter-spacing:-.05em}.cta p{margin:0 0 20px;color:#ffffffb3;font-size:13px;max-width:420px;line-height:1.6}
.cta svg.cs{position:absolute;right:0;top:0;height:100%;width:55%;z-index:-1;opacity:.9}
.foot-links{display:inline-flex;gap:18px;float:right}.foot-links a:hover{color:#111}
/* right rail */
.pulse{display:grid;gap:11px}.pulse div{display:flex;gap:10px;font-size:11px;color:#555;line-height:1.45}.pulse i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px;background:#7855c8}.pulse small{display:block;color:#a0a0a8;font-size:10px;margin-top:2px}
.knowledge{height:130px}
.knowledge svg{position:absolute;inset:0;width:100%;height:100%}
.knowledge:before,.knowledge:after{display:none}
@media(max-width:1180px){.feat-grid{grid-template-columns:repeat(2,1fr)}.live-grid{grid-template-columns:1fr}.galaxy-inner{grid-template-columns:1fr}.map{height:380px}.mountain-art{margin-left:-40px}}
@media(max-width:600px){.hero-top{grid-template-columns:1fr}.mountain-art{height:300px;margin:0 -19px -10px;-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 14%);mask-image:linear-gradient(0deg,transparent 0,#000 14%)}.feat-grid{grid-template-columns:1fr 1fr}.msgr{grid-template-columns:100px 1fr}.map{height:300px}.foot-links{display:none}}
</style>
</head>

 s+='<g class="faint">';AS.forEach(a=>{a.forEach((p,i)=>{if(i)s+=`<line x1="${a[i-1][0]}" y1="${a[i-1][1]}" x2="${p[0]}" y2="${p[1]}"/>`});a.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="1.8"/>`)});s+='</g>';
 s+=`<g>`+EDGES.map(([a,b])=>`<line class="link" x1="${NODES[a][0]}" y1="${NODES[a][1]}" x2="${NODES[b][0]}" y2="${NODES[b][1]}"/>`).join("")+`</g>`;
 NODES.forEach((n,i)=>{const big=i===4||i===3;const left=n[0]>480;s+=`<g class="node" tabindex="0" role="link" data-go="${TARGET[i]}"><circle class="halo" cx="${n[0]}" cy="${n[1]}" r="${big?22:17}"/><circle class="ring" cx="${n[0]}" cy="${n[1]}" r="${big?15:12}"/><path class="spike" d="M${n[0]-9} ${n[1]}H${n[0]+9}M${n[0]} ${n[1]-9}V${n[1]+9}"/><circle class="star" cx="${n[0]}" cy="${n[1]}" r="${big?4.2:3.2}"/><text x="${left?n[0]-12:n[0]+12}" y="${n[1]+(i%2?18:-10)}" text-anchor="${left?"end":"start"}" data-i="${n[2]}"></text></g>`});
 s+=`<text class="cname" x="320" y="418" text-anchor="middle" data-i="cname"></text>`;
 el.innerHTML=s;
 el.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)document.getElementById(g.dataset.go).scrollIntoView({behavior:"smooth"})});
 el.addEventListener("keydown",e=>{if(e.key==="Enter"){const g=e.target.closest("[data-go]");if(g)document.getElementById(g.dataset.go).scrollIntoView({behavior:"smooth"})}})}

 k+='<g fill="none" stroke="#e1ccff" opacity=".8"><ellipse cx="120" cy="65" rx="78" ry="26" transform="rotate(-22 120 65)"/><ellipse cx="120" cy="65" rx="50" ry="14" transform="rotate(-22 120 65)" opacity=".5"/></g><circle cx="120" cy="65" r="3" fill="#fff"/><circle cx="190" cy="42" r="2" fill="#fff"/><circle cx="60" cy="88" r="2" fill="#fff"/>';

/* ---------- language ---------- */
function setLanguage(l){LANG=T[l]?l:"ru";const d=T[LANG];document.documentElement.lang=LANG;
 document.querySelectorAll("[data-i]").forEach(e=>{const k=e.dataset.i,v=d[k]||T.ru[k];if(v!==undefined)e.innerHTML=v});
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=tt(e.dataset.ph));
 if(!D[LANG])LANG=LANG; AIMSG=null;renderRooms();renderMsgs();renderThreads();aiRender();renderTasks()}
document.getElementById("lang").addEventListener("change",e=>setLanguage(e.target.value));

/* ---------- sidebar highlight ---------- */
const secs=["home","messenger","ai","community","notes"];
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll(".left .nav a").forEach(a=>a.classList.toggle("active",a.dataset.sec===e.target.id))}})},{rootMargin:"-35% 0px -55% 0px"});
secs.forEach(id=>io.observe(document.getElementById(id)));

drawMap();drawSmall();setLanguage("ru");
