<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космос</title>
<style>
  /* Чёрный цвет только у html. Если залить им и body, он перекроет холст */
  html { background: #000; }
  html, body { margin: 0; height: 100%; }
  body { background: transparent; }
  #space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
</style>
</head>
<body>
<canvas id="space"></canvas>

<script>
(() => {
  const cv = document.getElementById('space');
  const ctx = cv.getContext('2d');

  // ===== НАСТРОЙКИ =====
  let SPEED = 0.022;            // скорость полёта: меньше = медленнее
  const SPAWN_EVERY = [9, 15];  // как часто появляются планеты/туманности (сек, от и до)
  // ======================
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) SPEED *= 0.4;

  // палитры: c - цвета поверхности (от тёмного к светлому), a - цвет атмосферы
  const GAS = [
    { c: [[40,15,80],[120,60,200],[205,165,245],[90,40,150]],  a: [170,120,255] },
    { c: [[60,10,60],[170,50,150],[245,175,225],[110,30,100]], a: [255,130,220] },
    { c: [[15,20,70],[60,80,200],[175,195,255],[40,50,130]],   a: [120,150,255] },
    { c: [[70,38,52],[190,130,112],[242,205,175],[120,70,82]], a: [255,170,140] }
  ];
  const ROCK = [
    { c: [[15,8,30],[60,35,100],[130,90,180],[205,175,235]],   a: [160,110,255] },
    { c: [[20,18,28],[70,65,90],[140,130,160],[212,207,228]],  a: [170,150,230] },
    { c: [[30,12,10],[100,45,35],[170,100,70],[225,175,135]],  a: [255,150,110] }
  ];
  // туманности: [внешний, средний, яркое ядро]
  const NEB = [
    [[70,25,190],[200,55,200],[255,200,240]],
    [[50,35,170],[140,70,230],[225,200,255]],
    [[110,20,120],[225,55,140],[255,190,205]]
  ];

  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.random() * a.length | 0];
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };

  // ---------- шум ----------
  let seed = 0;
  const hash = (x, y, z) => {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1440662683) + seed | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  function noise(x, y, z) {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let fx = x - xi, fy = y - yi, fz = z - zi;
    fx *= fx * (3 - 2 * fx); fy *= fy * (3 - 2 * fy); fz *= fz * (3 - 2 * fz);
    const a = lerp(lerp(hash(xi,yi,zi), hash(xi+1,yi,zi), fx), lerp(hash(xi,yi+1,zi), hash(xi+1,yi+1,zi), fx), fy);
    const b = lerp(lerp(hash(xi,yi,zi+1), hash(xi+1,yi,zi+1), fx), lerp(hash(xi,yi+1,zi+1), hash(xi+1,yi+1,zi+1), fx), fy);
    return lerp(a, b, fz);
  }
  function fbm(x, y, z, o) {
    let s = 0, a = 0.5, n = 0;
    for (let i = 0; i < o; i++) { s += a * noise(x, y, z); n += a; x *= 2.03; y *= 2.03; z *= 2.03; a *= 0.5; }
    return s / n;
  }
  function lut(st) {
    const L = [];
    for (let i = 0; i < 256; i++) {
      const t = i / 255 * (st.length - 1), k = Math.min(st.length - 2, t | 0), f = t - k;
      L.push(st[k].map((c, j) => lerp(c, st[k + 1][j], f)));
    }
    return L;
  }
  const canvas = n => { const c = document.createElement('canvas'); c.width = c.height = n; return c; };

  // ---------- планета: сфера с текстурой, освещением и тенью ----------
  function makePlanet() {
    seed = Math.random() * 1e6 | 0;
    const gas = Math.random() < 0.55, pal = pick(gas ? GAS : ROCK), L = lut(pal.c), atm = pal.a;
    const R = 150, S = 700, T = R * 2, off = rnd(0, 50);
    let lx = -rnd(0.45, 0.85), ly = -rnd(0.2, 0.6), lz = 0.55;       // откуда светит звезда
    const ln = Math.hypot(lx, ly, lz); lx /= ln; ly /= ln; lz /= ln;

    const tex = canvas(T), tc = tex.getContext('2d'), im = tc.createImageData(T, T), d = im.data;
    for (let py = 0; py < T; py++) for (let px = 0; px < T; px++) {
      const nx = (px + 0.5 - R) / R, ny = (py + 0.5 - R) / R, r2 = nx * nx + ny * ny;
      if (r2 >= 1) continue;
      const nz = Math.sqrt(1 - r2);
      let v;
      if (gas) { const t = fbm(nx*1.6+off, ny*5+off, nz*1.6, 4); v = 0.5 + 0.5 * Math.sin(ny * 11 + t * 6); }
      else     { v = clamp((fbm(nx*2.4+off, ny*2.4+off, nz*2.4+off, 5) - 0.25) * 1.7); }
      const c = L[v * 255 | 0];
      const dot = nx * lx + ny * ly + nz * lz;
      const lit = Math.pow(clamp((dot + 0.12) / 1.12), 1.15);          // день / терминатор / ночь
      const rim = Math.pow(1 - nz, 3) * (0.25 + 0.75 * clamp(dot + 0.3)) * 0.9; // свет атмосферы на краю
      const k = 0.03 + lit, i = (py * T + px) * 4, night = 1 - lit;
      d[i]   = c[0] * k + atm[0] * rim + 8 * night;
      d[i+1] = c[1] * k + atm[1] * rim + 4 * night;
      d[i+2] = c[2] * k + atm[2] * rim + 16 * night;
      d[i+3] = clamp((1 - Math.sqrt(r2)) * R * 0.9) * 255;
    }
    tc.putImageData(im, 0, 0);

    const sp = canvas(S), g = sp.getContext('2d'), C = S / 2;
    const ring = Math.random() < 0.4, k = rnd(0.2, 0.3), tilt = rnd(-0.45, 0.45);
    const bands = Array.from({ length: 28 }, () => Math.random() < 0.2 ? 0 : rnd(0.1, 0.5));
    const rc = L[190];
    const drawRing = front => {
      if (!ring) return;
      g.save(); g.translate(C, C); g.rotate(tilt); g.scale(1, k);
      bands.forEach((al, i) => {
        if (!al) return;
        g.strokeStyle = `rgba(${rc[0]|0},${rc[1]|0},${rc[2]|0},${al})`;
        g.lineWidth = R * 0.034;
        g.beginPath(); g.arc(0, 0, R * (1.5 + i * 0.026), front ? 0 : Math.PI, front ? Math.PI : Math.PI * 2); g.stroke();
      });
      g.restore();
    };
    drawRing(false);
    g.drawImage(tex, C - R, C - R);

    // атмосфера: свечение вокруг, ярче со стороны звезды
    const A = canvas(S), a = A.getContext('2d');
    const gr = a.createRadialGradient(C, C, R * 0.97, C, C, R * 1.18);
    gr.addColorStop(0, `rgba(${atm},0.55)`); gr.addColorStop(1, `rgba(${atm},0)`);
    a.fillStyle = gr; a.fillRect(0, 0, S, S);
    a.globalCompositeOperation = 'destination-in';
    const n2 = Math.hypot(lx, ly), mg = a.createLinearGradient(C + lx/n2*R, C + ly/n2*R, C - lx/n2*R, C - ly/n2*R);
    mg.addColorStop(0, 'rgba(0,0,0,1)'); mg.addColorStop(1, 'rgba(0,0,0,0.08)');
    a.fillStyle = mg; a.fillRect(0, 0, S, S);
    g.globalCompositeOperation = 'lighter'; g.drawImage(A, 0, 0); g.globalCompositeOperation = 'source-over';

    drawRing(true);
    return { type: 'planet', sp, S, R };
  }

  // ---------- туманность: облака из шума с тёмными полосами пыли ----------
  function makeNebula() {
    seed = Math.random() * 1e6 | 0;
    const N = 200, pal = pick(NEB), c = canvas(N), g = c.getContext('2d');
    const im = g.createImageData(N, N), d = im.data, sc = rnd(2.2, 3.4), ox = rnd(0, 40);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const u = x / N * 2 - 1, v = y / N * 2 - 1, r2 = u * u + v * v;
      if (r2 >= 1) continue;
      const X = u * sc + ox, Y = v * sc;
      const q = fbm(X, Y, 1.3, 4), w = fbm(X + 3.2 * q, Y + 3.2 * q, 7.7, 4);   // «закрученные» облака
      let den = sm(0.32, 0.85, w) * Math.pow(1 - r2, 1.6);
      den *= 1 - 0.65 * sm(0.5, 0.72, fbm(X * 1.7, Y * 1.7, 15, 3));            // тёмная пыль
      const m = clamp(q * 1.6 - 0.3), core = sm(0.55, 1, den * 1.6) * 0.8, i = (y * N + x) * 4;
      for (let j = 0; j < 3; j++) d[i + j] = lerp(lerp(pal[0][j], pal[1][j], m), pal[2][j], core);
      d[i + 3] = clamp(den * 1.15) * 255 * 0.7;
    }
    g.putImageData(im, 0, 0);
    return { type: 'nebula', img: c };
  }

  // ---------- сцена ----------
  let W, H, dpr, bg, stars = [], objs = [], next = null, last = 0, spawnT = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.hypot(W, H) / 2);
    bg.addColorStop(0, '#12062a'); bg.addColorStop(0.6, '#07020f'); bg.addColorStop(1, '#000');
    const n = Math.min(500, Math.max(140, (W * H / 5000) | 0));
    stars = Array.from({ length: n }, () => mkStar(true));
  }
  const mkStar = any => ({ x: rnd(-1, 1), y: rnd(-1, 1), z: any ? rnd(0.04, 1) : 1, c: pick(['#fff','#e9d5ff','#c4b5fd','#ddd6fe']) });

  function place(o, z) {
    o.z = z;
    if (o.type === 'nebula') { o.x = rnd(-0.7, 0.7); o.y = rnd(-0.6, 0.6); o.size = Math.max(W, H) * rnd(0.6, 0.9); }
    else { o.x = (Math.random() < 0.5 ? -1 : 1) * rnd(0.28, 0.75); o.y = rnd(-0.5, 0.5); o.r = Math.min(W, H) * rnd(0.03, 0.06); }
    objs.push(o);
  }
  // следующий объект готовим заранее и по частям, чтобы анимация не подвисала
  const prep = () => setTimeout(() => { next = Math.random() < 0.5 ? makeNebula() : makePlanet(); }, 400);
  function spawn() { if (!next) return; place(next, 1); next = null; prep(); spawnT = rnd(...SPAWN_EVERY); }

  const fade = z => Math.max(0, Math.min(1, (1 - z) / 0.12, (z - 0.18) / 0.22));
  const proj = o => [W / 2 + o.x / o.z * W / 2, H / 2 + o.y / o.z * H / 2];

  function frame(t) {
    const dt = Math.min((t - last) / 1000 || 0, 0.05); last = t;

    for (const s of stars) {
      s.z -= SPEED * dt;
      const [sx, sy] = proj(s);
      if (s.z < 0.03 || sx < -5 || sx > W + 5 || sy < -5 || sy > H + 5) Object.assign(s, mkStar(false));
    }
    objs.forEach(o => o.z -= SPEED * dt);
    objs = objs.filter(o => {
      if (o.z < 0.18) return false;
      const [sx, sy] = proj(o), e = (o.type === 'nebula' ? o.size : o.r * 2.6) / o.z;
      return sx > -e && sx < W + e && sy > -e && sy < H + e;
    });
    if ((spawnT -= dt) <= 0) spawn();

    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const sorted = objs.slice().sort((a, b) => b.z - a.z);

    ctx.globalCompositeOperation = 'lighter';
    for (const o of sorted) if (o.type === 'nebula') {
      const s = o.size / o.z, [sx, sy] = proj(o);
      ctx.globalAlpha = fade(o.z) * 0.9;
      ctx.drawImage(o.img, sx - s / 2, sy - s / 2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';

    for (const s of stars) {
      const [sx, sy] = proj(s);
      ctx.globalAlpha = Math.min(1, (1 - s.z) * 2 + 0.15);
      ctx.fillStyle = s.c;
      ctx.beginPath(); ctx.arc(sx, sy, (1 - s.z) * 1.6 + 0.3, 0, Math.PI * 2); ctx.fill();
    }

    for (const o of sorted) if (o.type === 'planet') {
      const sc = (o.r / o.z) / o.R, dw = o.S * sc, [sx, sy] = proj(o);
      ctx.globalAlpha = fade(o.z);
      ctx.drawImage(o.sp, sx - dw / 2, sy - dw / 2, dw, dw);
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  place(makeNebula(), 0.8);   // сразу что-то видно
  place(makePlanet(), 0.55);
  spawnT = rnd(...SPAWN_EVERY);
  prep();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
