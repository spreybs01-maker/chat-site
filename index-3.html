<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZADNEPROVSKII chat</title>
<style>
:root{--bg:#fff;--text:#000;--mut:#6b6b6b;--line:#e6e6e6;--soft:#f3f3f3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:640px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
button,input{font:inherit;color:var(--text)}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #000;outline-offset:2px}
svg{width:22px;height:22px;stroke:#000;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

/* верхняя панель */
.top{display:flex;align-items:center;gap:8px;padding:14px 16px}
.brand{flex:1;font-weight:700;letter-spacing:.02em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:#fff;border:1px solid #000;border-radius:999px;padding:7px 14px;font-size:14px;line-height:1}
.pill:hover{background:var(--soft)}
.lang b{font-weight:700}
.lang span{color:var(--mut)}

/* главная */
.home{justify-content:center;align-items:center;text-align:center;padding:8px 24px 40px;gap:28px}
.bear{width:min(58vw,250px);aspect-ratio:1;border-radius:28px;display:block}
.home h1{margin:0;font-size:clamp(28px,7vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.03em;max-width:12em}
.home p{margin:10px 0 0;font-size:18px;color:var(--mut)}
.btn{background:#000;color:#fff;border:0;border-radius:999px;padding:15px 30px;font-weight:600}
.btn:active{transform:scale(.98)}

/* окно «Подробнее» */
#info{position:fixed;inset:0;background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#info.on{display:flex}
.card{background:#fff;border:1px solid #000;border-radius:24px;max-width:460px;width:100%;max-height:100%;overflow:auto;padding:24px}
.card h2{margin:0 0 12px;font-size:22px;letter-spacing:-.02em}
.card p{margin:0 0 12px}
.card p:last-child{margin:0;color:var(--mut)}
.card .row{display:flex;justify-content:space-between;align-items:center}

/* комната */
header{display:flex;align-items:center;gap:6px;padding:10px 8px;border-bottom:1px solid var(--line);position:relative}
.ic{background:none;border:0;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;flex:none}
.ic:hover{background:var(--soft)}
header .t{flex:1;min-width:0;text-align:center}
header b{display:block;font-weight:600}
header small{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .pill{margin-right:4px}
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:9px 14px;border-radius:18px;background:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:#fff;border:1.5px solid #000}
.m small{display:block;font-size:12px;color:var(--mut);margin-bottom:1px}
.m img{display:block;max-width:min(260px,100%);height:auto;border-radius:12px;margin-top:4px;cursor:zoom-in}
.sys{align-self:center;color:var(--mut);font-size:14px;text-align:center}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.bar input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:12px 18px;background:#fff}
.bar input::placeholder{color:#8a8a8a}
.bar .btn{padding:12px 20px}
.copied{font-size:13px;color:var(--mut);position:absolute;right:12px;top:58px;background:#fff}

/* просмотр фото */
#lb{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>

      msg: "Message", quiet: "It is quiet here. Write first!", lost: "Connection lost, reconnecting…",
      full: "The room is full.", imgFail: "Could not send the photo. Try another one.",
      back: "Back", copy: "Copy link", attach: "Attach photo", send: "Send", close: "Close"
    }
  };
  var lang = "en";
  try { lang = localStorage.getItem("lang") || ""; } catch (e) {}
  if (lang !== "ru" && lang !== "en") lang = (navigator.language || "").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
  var t = function (k) { return TXT[lang][k]; };

  var m = location.pathname.match(/^\/room\/([a-z0-9-]{1,32})\/?$/i);
  var roomId = m ? m[1] : null;
  var ws = null, myName = "", lastUsers = [];
  try { myName = localStorage.getItem("nick") || ""; } catch (e) {}

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach(function (e) { e.textContent = t(e.getAttribute("data-i")); });
    document.querySelectorAll("[data-ph]").forEach(function (e) { e.placeholder = t(e.getAttribute("data-ph")); });
    document.querySelectorAll("[data-aria]").forEach(function (e) { e.setAttribute("aria-label", t(e.getAttribute("data-aria"))); });
    document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
      b.innerHTML = lang === "ru" ? "<b>RU</b> <span>/ EN</span>" : "<span>RU /</span> <b>EN</b>";
    });
    if (roomId) {
      $("title").textContent = t("room") + " " + roomId;
      $("users").textContent = lastUsers.length ? t("inRoom") + lastUsers.join(", ") : "";
    }
  }
  document.querySelectorAll("[data-lang-btn]").forEach(function (b) {
    b.onclick = function () {
      lang = lang === "ru" ? "en" : "ru";
      try { localStorage.setItem("lang", lang); } catch (e) {}
      applyLang();
    };
  });

  /* окно «Подробнее» */
  function info(on) { $("info").classList.toggle("on", on); }
  $("more").onclick = function () { info(true); };
  $("info-x").onclick = function () { info(false); };
  $("info").onclick = function (e) { if (e.target === $("info")) info(false); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { info(false); $("lb").classList.remove("on"); }
  });
  $("lb").onclick = function () { $("lb").classList.remove("on"); };

  function rid() {
    var a = "abcdefghjkmnpqrstuvwxyz23456789", s = "";
    for (var i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)];
    return s;
  }

  applyLang();

  if (!roomId) {
    $("home").classList.add("on");
    $("create").onclick = function () { location.href = "/room/" + rid(); };
    return;
  }

  $("room").classList.add("on");
  $("home-btn").onclick = function () { location.href = "/"; };
  if (myName) $("nick").value = myName;

  function add(cls, name, text, img) {
    var box = $("msgs");
    var near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    var d = document.createElement("div");
    d.className = cls;
    if (name) {
      var s = document.createElement("small");
      s.textContent = name;
      d.appendChild(s);
    }
    if (text) {
      var p = document.createElement("span");
      p.textContent = text;
      d.appendChild(p);
    }
    if (img) {
      var im = document.createElement("img");
      im.alt = "";
      im.src = img;
      im.onload = function () { if (near) box.scrollTop = box.scrollHeight; };
      im.onclick = function () { $("lb").querySelector("img").src = img; $("lb").classList.add("on"); };
      d.appendChild(im);
    }
    box.appendChild(d);
    if (near || cls.indexOf("me") > -1) box.scrollTop = box.scrollHeight;
  }

  function connect() {
    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    ws = new WebSocket(proto + location.host);
    ws.onopen = function () {
      ws.send(JSON.stringify({ type: "join", room: roomId, name: myName }));
    };
    ws.onmessage = function (e) {
      var d = JSON.parse(e.data);
      if (d.type === "history") {
        $("msgs").innerHTML = "";
        if (!d.list.length) add("sys", "", t("quiet"));
        d.list.forEach(function (x) { add(x.name === myName ? "m me" : "m", x.name, x.text, x.img); });
      } else if (d.type === "msg") {
        add(d.name === myName ? "m me" : "m", d.name, d.text, d.img);
      } else if (d.type === "users") {
        lastUsers = d.list;
        $("users").textContent = t("inRoom") + d.list.join(", ");
      } else if (d.type === "full") {
        add("sys", "", t("full"));
      }
    };
    ws.onclose = function () {
      add("sys", "", t("lost"));
      setTimeout(connect, 2000);
    };
  }

  function start() {
    var v = $("nick").value.trim();
    if (!v) return;
    myName = v;
    try { localStorage.setItem("nick", v); } catch (e) {}
    $("namebar").style.display = "none";
    $("f").style.display = "flex";
    $("txt").focus();
    connect();
  }
  $("join").onclick = start;
  $("nick").onkeydown = function (e) { if (e.key === "Enter") start(); };

  $("f").onsubmit = function (e) {
    e.preventDefault();
    var v = $("txt").value.trim();
    if (!v || !ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: "msg", text: v }));
    $("txt").value = "";
  };

  /* фото: уменьшаем перед отправкой */
  $("attach").onclick = function () { $("file").click(); };
  $("file").onchange = function () {
    var f = $("file").files[0];
    $("file").value = "";
    if (!f || !ws || ws.readyState !== 1) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var max = 1000, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * s));
      c.height = Math.max(1, Math.round(img.naturalHeight * s));
      var x = c.getContext("2d");
      x.fillStyle = "#fff";
      x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL("image/jpeg", 0.78);
      if (data.length > 1900000) { add("sys", "", t("imgFail")); return; }
      ws.send(JSON.stringify({ type: "img", data: data }));
    };
    img.onerror = function () { URL.revokeObjectURL(url); add("sys", "", t("imgFail")); };
    img.src = url;
  };

  $("copy").onclick = function () {
    var c = $("copied");
    var ok = function () { c.hidden = false; setTimeout(function () { c.hidden = true; }, 2000); };
    if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(ok);
  };
})();
</script>
</body>
</html>
